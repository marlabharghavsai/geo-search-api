user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Define a zone for rate limiting, 10m can store ~160,000 IPs
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=60r/m;
    limit_req_status 429;

    # Define the cache path and parameters
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;

        location /api/ {
            # Apply rate limiting
            limit_req zone=api_rate_limit burst=10 nodelay;

            # Add rate limit headers
            add_header X-RateLimit-Limit $limit_req_rate always;
            add_header X-RateLimit-Remaining $limit_req_status always;

            # Cache configuration
            proxy_cache_methods GET;
            proxy_cache api_cache;
            proxy_cache_valid 200 10m; # Cache 200 responses for 10 minutes
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            # Forward to the backend service
            proxy_pass http://backend:3000;
        }
    }
}
